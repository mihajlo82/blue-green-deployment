name: Blue-Green Deploy

on:
  push:
    branches:
      - main   # Blue
      - dev    # Green

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Install dependencies locally (optional)
      - name: Install dependencies
        run: npm install

      # Step 4: Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to app folder
            cd /home/ec2-user/app

            # Pull latest code via SSH
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # Install/update dependencies
            npm install

            # Reload or start Node.js app with PM2
            pm2 reload app || pm2 start app/index.js --name app --update-env

            # Show PM2 status for verification
            pm2 status

            # Optional: test app locally
            curl http://localhost:3000
